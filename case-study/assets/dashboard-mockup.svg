<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 780" width="375" height="780" role="img" aria-label="Habityn Today dashboard mockup">
  <defs>
    <pattern id="dotgrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.05)"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#A8FF00" stop-opacity="0"/>
      <stop offset="100%" stop-color="#A8FF00" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <!-- Phone shell -->
  <rect x="0" y="0" width="375" height="780" rx="36" fill="#08080E"/>
  <rect x="6" y="6" width="363" height="768" rx="30" fill="#111116"/>
  <rect x="6" y="6" width="363" height="768" rx="30" fill="url(#dotgrid)"/>

  <!-- Notch -->
  <rect x="140" y="14" width="95" height="22" rx="11" fill="#08080E"/>

  <!-- Header -->
  <text x="30" y="78" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#F0F0EE">Good morning</text>
  <text x="30" y="100" font-family="system-ui,sans-serif" font-size="13" fill="rgba(240,240,238,0.45)">Tuesday, 23 June</text>

  <!-- Theme toggle -->
  <circle cx="335" cy="80" r="18" fill="#1C1C22"/>
  <circle cx="335" cy="80" r="7" fill="none" stroke="#A8FF00" stroke-width="2"/>
  <line x1="335" y1="69" x2="335" y2="72" stroke="#A8FF00" stroke-width="2" stroke-linecap="round"/>
  <line x1="335" y1="88" x2="335" y2="91" stroke="#A8FF00" stroke-width="2" stroke-linecap="round"/>
  <line x1="324" y1="80" x2="327" y2="80" stroke="#A8FF00" stroke-width="2" stroke-linecap="round"/>
  <line x1="343" y1="80" x2="346" y2="80" stroke="#A8FF00" stroke-width="2" stroke-linecap="round"/>

  <!-- Progress ring card -->
  <rect x="30" y="126" width="315" height="150" rx="22" fill="#1C1C22" filter="url(#cardShadow)"/>
  <rect x="30" y="126" width="315" height="150" rx="22" fill="url(#ringGlow)"/>

  <!-- ring -->
  <circle cx="103" cy="201" r="54" fill="none" stroke="rgba(240,240,238,0.08)" stroke-width="11"/>
  <circle cx="103" cy="201" r="54" fill="none" stroke="#A8FF00" stroke-width="11" stroke-linecap="round"
          stroke-dasharray="245 339" transform="rotate(-90 103 201)"/>
  <text x="103" y="196" font-family="Georgia,serif" font-size="26" font-weight="900" fill="#F0F0EE" text-anchor="middle">72%</text>
  <text x="103" y="213" font-family="system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="rgba(240,240,238,0.4)" text-anchor="middle">TODAY</text>

  <!-- streak badge -->
  <rect x="186" y="146" width="138" height="32" rx="16" fill="#2A1E00"/>
  <text x="255" y="167" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#F5A623" text-anchor="middle">🔥 14 day streak</text>

  <!-- mini stats -->
  <text x="186" y="206" font-family="Georgia,serif" font-size="20" font-weight="900" fill="#F0F0EE">5/7</text>
  <text x="186" y="222" font-family="system-ui,sans-serif" font-size="9" letter-spacing="0.5" fill="rgba(240,240,238,0.4)">THIS WEEK</text>
  <text x="262" y="206" font-family="Georgia,serif" font-size="20" font-weight="900" fill="#A8FF00">21d</text>
  <text x="262" y="222" font-family="system-ui,sans-serif" font-size="9" letter-spacing="0.5" fill="rgba(240,240,238,0.4)">BEST STREAK</text>

  <!-- dot track -->
  <circle cx="186" cy="246" r="6" fill="#A8FF00"/>
  <circle cx="204" cy="246" r="6" fill="#A8FF00"/>
  <circle cx="222" cy="246" r="6" fill="#A8FF00"/>
  <circle cx="240" cy="246" r="6" fill="rgba(240,240,238,0.12)"/>
  <circle cx="258" cy="246" r="6" fill="rgba(240,240,238,0.12)"/>

  <!-- Category filter chips -->
  <rect x="30" y="296" width="70" height="30" rx="15" fill="#A8FF00"/>
  <text x="65" y="316" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F0F14" text-anchor="middle">All</text>
  <rect x="106" y="296" width="78" height="30" rx="15" fill="#1C1C22"/>
  <text x="145" y="316" font-family="system-ui,sans-serif" font-size="12" fill="rgba(240,240,238,0.6)" text-anchor="middle">Health</text>
  <rect x="190" y="296" width="78" height="30" rx="15" fill="#1C1C22"/>
  <text x="229" y="316" font-family="system-ui,sans-serif" font-size="12" fill="rgba(240,240,238,0.6)" text-anchor="middle">Fitness</text>
  <rect x="274" y="296" width="70" height="30" rx="15" fill="#1C1C22"/>
  <text x="309" y="316" font-family="system-ui,sans-serif" font-size="12" fill="rgba(240,240,238,0.6)" text-anchor="middle">More</text>

  <!-- Habit row 1 — completed -->
  <rect x="30" y="346" width="315" height="64" rx="18" fill="#1C1C22" filter="url(#cardShadow)"/>
  <rect x="44" y="360" width="36" height="36" rx="12" fill="#0D1F0F"/>
  <text x="62" y="384" font-size="18" text-anchor="middle">💧</text>
  <text x="94" y="373" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#F0F0EE">Drink water</text>
  <text x="94" y="390" font-family="system-ui,sans-serif" font-size="11" fill="rgba(240,240,238,0.4)">8 cups · every day</text>
  <circle cx="318" cy="378" r="15" fill="#A8FF00"/>
  <path d="M311 378 l4.5 4.5 l8-9" stroke="#0F0F14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Habit row 2 — pending -->
  <rect x="30" y="422" width="315" height="64" rx="18" fill="#1C1C22" filter="url(#cardShadow)"/>
  <rect x="44" y="436" width="36" height="36" rx="12" fill="#1A1004"/>
  <text x="62" y="460" font-size="18" text-anchor="middle">📚</text>
  <text x="94" y="449" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#F0F0EE">Read 20 pages</text>
  <text x="94" y="466" font-family="system-ui,sans-serif" font-size="11" fill="rgba(240,240,238,0.4)">Learning · weekdays</text>
  <circle cx="318" cy="454" r="15" fill="none" stroke="rgba(240,240,238,0.25)" stroke-width="2"/>

  <!-- Habit row 3 — active/in-progress -->
  <rect x="30" y="498" width="315" height="64" rx="18" fill="#15170A" stroke="#A8FF00" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="44" y="512" width="36" height="36" rx="12" fill="#13230A"/>
  <text x="62" y="536" font-size="18" text-anchor="middle">🏃</text>
  <text x="94" y="525" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#A8FF00">Morning run</text>
  <text x="94" y="542" font-family="system-ui,sans-serif" font-size="11" fill="rgba(168,255,0,0.55)">Fitness · 5km goal</text>
  <circle cx="318" cy="530" r="15" fill="none" stroke="#A8FF00" stroke-width="2"/>

  <!-- Floating pill nav -->
  <rect x="64" y="700" width="247" height="56" rx="28" fill="#1C1C22" filter="url(#cardShadow)"/>
  <rect x="80" y="712" width="84" height="32" rx="16" fill="#A8FF00"/>
  <text x="108" y="733" font-size="14" text-anchor="middle">🏠</text>
  <text x="135" y="733" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F0F14">Today</text>
  <text x="222" y="733" font-size="16" text-anchor="middle" opacity="0.5">📊</text>
  <text x="278" y="733" font-size="16" text-anchor="middle" opacity="0.5">⚙️</text>
</svg>
