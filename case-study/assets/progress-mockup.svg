<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 780" width="375" height="780" role="img" aria-label="Habityn progress and analytics mockup">
  <defs>
    <pattern id="dotgrid2" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.05)"/>
    </pattern>
    <filter id="cardShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="375" height="780" rx="36" fill="#08080E"/>
  <rect x="6" y="6" width="363" height="768" rx="30" fill="#111116"/>
  <rect x="6" y="6" width="363" height="768" rx="30" fill="url(#dotgrid2)"/>
  <rect x="140" y="14" width="95" height="22" rx="11" fill="#08080E"/>

  <text x="30" y="78" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#F0F0EE">Progress</text>
  <rect x="240" y="60" width="50" height="28" rx="14" fill="#1C1C22"/>
  <text x="265" y="79" font-family="system-ui,sans-serif" font-size="11" fill="rgba(240,240,238,0.6)" text-anchor="middle">Week</text>
  <rect x="296" y="60" width="50" height="28" rx="14" fill="#A8FF00"/>
  <text x="321" y="79" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#0F0F14" text-anchor="middle">Month</text>

  <!-- Stat cards row -->
  <rect x="30" y="108" width="98" height="78" rx="16" fill="#1C1C22" filter="url(#cardShadow2)"/>
  <text x="79" y="146" font-family="Georgia,serif" font-size="22" font-weight="900" fill="#A8FF00" text-anchor="middle">21</text>
  <text x="79" y="166" font-family="system-ui,sans-serif" font-size="9" letter-spacing="0.5" fill="rgba(240,240,238,0.45)" text-anchor="middle">LONGEST STREAK</text>

  <rect x="138" y="108" width="98" height="78" rx="16" fill="#1C1C22" filter="url(#cardShadow2)"/>
  <text x="187" y="146" font-family="Georgia,serif" font-size="22" font-weight="900" fill="#F0F0EE" text-anchor="middle">86%</text>
  <text x="187" y="166" font-family="system-ui,sans-serif" font-size="9" letter-spacing="0.5" fill="rgba(240,240,238,0.45)" text-anchor="middle">COMPLETION</text>

  <rect x="246" y="108" width="99" height="78" rx="16" fill="#1C1C22" filter="url(#cardShadow2)"/>
  <text x="295" y="146" font-family="Georgia,serif" font-size="22" font-weight="900" fill="#F0F0EE" text-anchor="middle">42</text>
  <text x="295" y="166" font-family="system-ui,sans-serif" font-size="9" letter-spacing="0.5" fill="rgba(240,240,238,0.45)" text-anchor="middle">ACTIVE DAYS</text>

  <!-- Bar chart card -->
  <rect x="30" y="206" width="315" height="190" rx="20" fill="#1C1C22" filter="url(#cardShadow2)"/>
  <text x="50" y="234" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="rgba(240,240,238,0.7)">Daily completions</text>

  <!-- bars: Mon..Sun -->
  <g font-family="system-ui,sans-serif" font-size="10" fill="rgba(240,240,238,0.4)" text-anchor="middle">
    <rect x="52"  y="300" width="22" height="60" rx="6" fill="#A8FF00"/>
    <rect x="92"  y="280" width="22" height="80" rx="6" fill="#A8FF00"/>
    <rect x="132" y="330" width="22" height="30" rx="6" fill="rgba(240,240,238,0.12)"/>
    <rect x="172" y="270" width="22" height="90" rx="6" fill="#A8FF00"/>
    <rect x="212" y="290" width="22" height="70" rx="6" fill="#A8FF00"/>
    <rect x="252" y="316" width="22" height="44" rx="6" fill="rgba(240,240,238,0.12)"/>
    <rect x="292" y="276" width="22" height="84" rx="6" fill="#A8FF00"/>
    <text x="63"  y="376">Mon</text>
    <text x="103" y="376">Tue</text>
    <text x="143" y="376">Wed</text>
    <text x="183" y="376">Thu</text>
    <text x="223" y="376">Fri</text>
    <text x="263" y="376">Sat</text>
    <text x="303" y="376">Sun</text>
  </g>

  <!-- Habit breakdown -->
  <text x="30" y="430" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="rgba(240,240,238,0.7)">Habit breakdown</text>

  <rect x="30" y="446" width="315" height="58" rx="16" fill="#1C1C22"/>
  <rect x="46" y="462" width="6" height="26" rx="3" fill="#84cc16"/>
  <text x="62" y="472" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#F0F0EE">Drink water</text>
  <rect x="62" y="480" width="220" height="6" rx="3" fill="rgba(240,240,238,0.1)"/>
  <rect x="62" y="480" width="220" height="6" rx="3" fill="#84cc16"/>
  <rect x="288" y="458" width="48" height="20" rx="10" fill="#0D1F0F"/>
  <text x="312" y="472" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#A8FF00" text-anchor="middle">PERFECT</text>

  <rect x="30" y="512" width="315" height="58" rx="16" fill="#1C1C22"/>
  <rect x="46" y="528" width="6" height="26" rx="3" fill="#f97316"/>
  <text x="62" y="538" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#F0F0EE">Morning run</text>
  <rect x="62" y="546" width="220" height="6" rx="3" fill="rgba(240,240,238,0.1)"/>
  <rect x="62" y="546" width="154" height="6" rx="3" fill="#f97316"/>
  <text x="312" y="542" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="rgba(240,240,238,0.5)" text-anchor="middle">70%</text>

  <rect x="30" y="578" width="315" height="58" rx="16" fill="#1C1C22"/>
  <rect x="46" y="594" width="6" height="26" rx="3" fill="#3b82f6"/>
  <text x="62" y="604" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#F0F0EE">Read 20 pages</text>
  <rect x="62" y="612" width="220" height="6" rx="3" fill="rgba(240,240,238,0.1)"/>
  <rect x="62" y="612" width="106" height="6" rx="3" fill="#3b82f6"/>
  <text x="312" y="608" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="rgba(240,240,238,0.5)" text-anchor="middle">48%</text>

  <!-- Floating pill nav -->
  <rect x="64" y="700" width="247" height="56" rx="28" fill="#1C1C22" filter="url(#cardShadow2)"/>
  <text x="108" y="733" font-size="16" text-anchor="middle" opacity="0.5">🏠</text>
  <rect x="186" y="712" width="92" height="32" rx="16" fill="#A8FF00"/>
  <text x="207" y="733" font-size="14" text-anchor="middle">📊</text>
  <text x="237" y="733" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F0F14">Progress</text>
  <text x="278" y="733" font-size="16" text-anchor="middle" opacity="0.5">⚙️</text>
</svg>
