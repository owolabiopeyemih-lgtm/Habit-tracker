<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Habityn dark and light theme comparison">
  <defs>
    <filter id="cs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="csl" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <pattern id="gridDark" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.05)"/>
    </pattern>
    <pattern id="gridLight" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(0,0,0,0.045)"/>
    </pattern>
  </defs>

  <!-- DARK PANEL -->
  <rect x="0" y="0" width="440" height="420" rx="24" fill="#111116"/>
  <rect x="0" y="0" width="440" height="420" rx="24" fill="url(#gridDark)"/>
  <text x="32" y="44" font-family="system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="rgba(240,240,238,0.4)">DARK MODE</text>

  <rect x="32" y="64" width="376" height="72" rx="18" fill="#1C1C22" filter="url(#cs)"/>
  <rect x="48" y="78" width="44" height="44" rx="14" fill="#13230A"/>
  <text x="70" y="106" font-size="20" text-anchor="middle">🏃</text>
  <text x="108" y="100" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#F0F0EE">Morning run</text>
  <text x="108" y="118" font-family="system-ui,sans-serif" font-size="12" fill="rgba(240,240,238,0.4)">Fitness · 5km goal</text>
  <circle cx="380" cy="100" r="17" fill="#A8FF00"/>
  <path d="M372 100 l5 5 l9-10" stroke="#0F0F14" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <rect x="32" y="150" width="376" height="60" rx="18" fill="#13150A" stroke="#A8FF00" stroke-width="1.5" stroke-opacity="0.45"/>
  <text x="56" y="186" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#A8FF00">14 day streak 🔥</text>
  <text x="384" y="186" font-family="Georgia,serif" font-size="20" font-weight="900" fill="#A8FF00" text-anchor="end">72%</text>

  <rect x="32" y="226" width="376" height="2" fill="rgba(255,255,255,0.06)"/>
  <text x="32" y="262" font-family="system-ui,sans-serif" font-size="12" fill="rgba(240,240,238,0.4)">Accent</text>
  <circle cx="40" cy="288" r="14" fill="#A8FF00"/>
  <text x="62" y="293" font-family="system-ui,sans-serif" font-size="13" fill="#F0F0EE" font-weight="700">#A8FF00 neon lime</text>
  <text x="32" y="324" font-family="system-ui,sans-serif" font-size="12" fill="rgba(240,240,238,0.4)">Surfaces</text>
  <circle cx="40" cy="350" r="14" fill="#111116" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="72" cy="350" r="14" fill="#1C1C22"/>
  <text x="94" y="355" font-family="system-ui,sans-serif" font-size="13" fill="#F0F0EE">void · cream · card</text>

  <!-- LIGHT PANEL -->
  <rect x="460" y="0" width="440" height="420" rx="24" fill="#FAFAF7"/>
  <rect x="460" y="0" width="440" height="420" rx="24" fill="url(#gridLight)"/>
  <text x="492" y="44" font-family="system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="rgba(28,25,23,0.45)">LIGHT MODE</text>

  <rect x="492" y="64" width="376" height="72" rx="18" fill="#FFFFFF" filter="url(#csl)"/>
  <rect x="508" y="78" width="44" height="44" rx="14" fill="#F2FDE8"/>
  <text x="530" y="106" font-size="20" text-anchor="middle">🏃</text>
  <text x="568" y="100" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1C1917">Morning run</text>
  <text x="568" y="118" font-family="system-ui,sans-serif" font-size="12" fill="rgba(28,25,23,0.5)">Fitness · 5km goal</text>
  <circle cx="840" cy="100" r="17" fill="#3A8C00"/>
  <path d="M832 100 l5 5 l9-10" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <rect x="492" y="150" width="376" height="60" rx="18" fill="#F2FDE8" stroke="#3A8C00" stroke-width="1.5" stroke-opacity="0.35"/>
  <text x="516" y="186" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#2C6E00">14 day streak 🔥</text>
  <text x="844" y="186" font-family="Georgia,serif" font-size="20" font-weight="900" fill="#2C6E00" text-anchor="end">72%</text>

  <rect x="492" y="226" width="376" height="2" fill="rgba(0,0,0,0.06)"/>
  <text x="492" y="262" font-family="system-ui,sans-serif" font-size="12" fill="rgba(28,25,23,0.45)">Accent</text>
  <circle cx="500" cy="288" r="14" fill="#3A8C00"/>
  <text x="522" y="293" font-family="system-ui,sans-serif" font-size="13" fill="#1C1917" font-weight="700">#3A8C00 forest green</text>
  <text x="492" y="324" font-family="system-ui,sans-serif" font-size="12" fill="rgba(28,25,23,0.45)">Surfaces</text>
  <circle cx="500" cy="350" r="14" fill="#F4F4F0" stroke="rgba(0,0,0,0.1)"/>
  <circle cx="532" cy="350" r="14" fill="#FFFFFF" stroke="rgba(0,0,0,0.1)"/>
  <text x="554" y="355" font-family="system-ui,sans-serif" font-size="13" fill="#1C1917">void · cream · card</text>
</svg>
